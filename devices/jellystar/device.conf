# devices/jellystar/device.conf: what works on the Jelly Star port, said in one place (the convention of the
# Pixel 5 port, github.com/DenialOfGravity/ios-redfin). tools/docs-gen.py makes docs/devices/jellystar.md from
# it: edit this file, run `python3 -I tools/docs-gen.py jellystar`, commit both.
#
# Lines: `KEY VALUE` (device facts) and `status SUBSYSTEM works|partial|missing NOTE`. # starts a comment.
#
# EVERY LINE BELOW IS "missing" OR "unknown" AND MUST STAY THAT WAY UNTIL A RESULT IS SEEN ON THE PHONE.
# Nothing here has run on a Jelly Star yet. The status convention exists so that "we read it in a device
# tree" can never be mistaken for "it boots"; see AGENTS.md.

device jellystar
	title       Unihertz Jelly Star
	vendor      Unihertz
	soc         mt6789 (Helio G99, 6x A55 + 2x A76, Mali-G57 MC2)
	ios         iOS 16.7.16 (iPhone X D22AP userland, target, not yet attempted)
	base        squeeeeezy/HelioDarwin (Infinix Note 12 2023, same MT6789) -- nothing applied to this phone
	recon       done 2026-11-06 on rooted Android 13 GSI; tools/recon.sh re-runs it
	boot        plan: boot_b, Android kept on boot_a (virtual A/B); whether LK accepts an XNU kernel is step 2
	facts       devices/jellystar/soc.args, checked by tools/check-facts.py against the DT
	dt          fw/jellystar.dtb + fw/dtbo.img from tools/extract-dt.py (Lineage 20261101)
	plan        docs/jellystar/port-plan.md, docs/jellystar/diff-vs-x676c.md
	status      boot        missing   nothing built or flashed; whether Unihertz LK takes an XNU kernel is untested
	status      display     missing   panel KNOWN: panel_ST7701S_Z30043, video mode, 480x854 @60Hz; no XNU driver yet
	status      touch       missing   chsc5xxx_touch on i2c0 0x2e (event2) -- no XNU driver exists in any port
	status      gpu         missing   Mali-G57 MC2 at 0x13000000, same part as the working X676C port
	status      cpu         missing   6x A55 published, 2x A76 excluded (same choice as X676C)
	status      storage     missing   MTK UFS 0x11270000 confirmed; userdata 228 GiB, iosroot carve undesigned
	status      buttons     missing   MT6366 keys on pwrap (power 116, func2 250), keypad 0x10010000 (volume 114/115, red key scan 249)
	status      backlight   missing   disp_pwm0 0x1100e000 behind whichever panel is fitted
	status      battery     missing   MT6366 fuel gauge not driven
	status      usb         missing   MT6789 MUSB 0x11200000 + T-PHY, Qualcomm DWC3 driver does not apply
	status      wifi        missing   MediaTek consys@18002000 (Wi-Fi/BT combo behind the connectivity DSP) -- no MTK Wi-Fi in any XNU port
	status      bluetooth   missing   same chip as Wi-Fi
	status      cellular    missing   MD modem, not started
	status      audio       missing   not started
	status      camera      missing   not started
	status      sensors     missing   not started
	status      nfc         missing   TMS NFC at i2c3, not started

name: check

# The device-tree checks need fw/jellystar.dtb and fw/dtbo.img, which are Unihertz
# binaries and are not in git. So CI runs what it can without them: the tools
# must parse, the help text must work, and the generated status page must not be
# stale. The DT-vs-facts check stays local, and tools/check.sh says so out loud
# rather than passing quietly.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: tools parse
        run: |
          for f in tools/*.py; do
            python3 -m py_compile "$f"
            echo "ok $f"
          done

      - name: tools print their usage
        run: |
          for t in fdt extract-dt check-facts diff-port; do
            python3 "tools/$t.py" --help >/dev/null 2>&1 \
              || python3 "tools/$t.py" >/dev/null 2>&1 \
              || { echo "FAIL $t"; exit 1; }
            echo "ok $t"
          done

      - name: device status page matches device.conf
        run: python3 -I tools/docs-gen.py jellystar --check

      - name: the plan does not claim anything works
        run: |
          ! grep -E 'status\s+\w+\s+(works|partial)' devices/jellystar/device.conf
          grep -q 'status      boot        missing' devices/jellystar/device.conf
          echo "ok: every subsystem is still missing"
